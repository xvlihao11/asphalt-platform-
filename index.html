<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沥青答题平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #1668dc;
    --primary-light: #e8f1fd;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2d3d;
    --text-sub: #7a8699;
    --green: #16a34a;
    --green-bg: #ecfdf3;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --border: #e5e9f0;
    --radius: 12px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6;
    padding-bottom: 64px;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #1668dc, #0e4fb3);
    color: #fff; padding: 14px 16px 12px;
    box-shadow: 0 2px 8px rgba(22,104,220,.25);
  }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .brand small { font-weight: 400; opacity: .75; font-size: 12px; }
  nav { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-x; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    color: rgba(255,255,255,.8); text-decoration: none; font-size: 14px; flex-shrink: 0;
    padding: 5px 14px; border-radius: 20px; white-space: nowrap; transition: .15s;
  }
  nav a.active, nav a:hover { background: rgba(255,255,255,.18); color: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 20px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 16px;
    margin-bottom: 12px; box-shadow: 0 1px 4px rgba(31,45,61,.06);
  }
  .page-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--text-sub); font-size: 13px; }
  .empty { text-align: center; color: var(--text-sub); padding: 48px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  .progress-wrap { background: #eef2f8; border-radius: 8px; height: 8px; margin: 12px 0 6px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg,#1668dc,#4d9bf5); border-radius: 8px; transition: width .3s; }
  .score-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-sub); }

  .q-card { border: 1px solid var(--border); }
  .q-head { display: flex; gap: 8px; align-items: flex-start; }
  .q-num {
    flex-shrink: 0; background: var(--primary-light); color: var(--primary);
    font-weight: 700; font-size: 13px; border-radius: 8px; padding: 2px 9px; margin-top: 2px;
  }
  .q-text { font-size: 15.5px; font-weight: 600; }
  .opts { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px;
    cursor: pointer; transition: .15s; background: #fff;
  }
  .opt:hover { border-color: var(--primary); background: #fafcff; }
  .opt .letter {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: #eef2f8; color: var(--text-sub); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .opt.correct { border-color: var(--green); background: var(--green-bg); }
  .opt.correct .letter { background: var(--green); color: #fff; }
  .opt.wrong { border-color: var(--red); background: var(--red-bg); }
  .opt.wrong .letter { background: var(--red); color: #fff; }
  .opt.chosen { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .opt.locked { cursor: default; }
  .opt.locked:hover { border-color: inherit; }

  .explain {
    margin-top: 12px; border-radius: 10px; padding: 12px 14px;
    background: #f6f8fc; border-left: 3px solid var(--primary); font-size: 14px;
  }
  .explain .verdict { font-weight: 700; margin-bottom: 4px; }
  .explain .verdict.ok { color: var(--green); }
  .explain .verdict.no { color: var(--red); }
  .refs { margin-top: 10px; }
  .refs .ref-title { font-size: 12.5px; color: var(--text-sub); margin-bottom: 4px; }
  .refs a {
    display: block; color: var(--primary); text-decoration: none; font-size: 13.5px;
    padding: 5px 0; word-break: break-all;
  }
  .refs a:before { content: "🔗 "; }
  .redo {
    margin-top: 10px; background: none; border: 1px solid var(--border); color: var(--text-sub);
    border-radius: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .redo:hover { border-color: var(--primary); color: var(--primary); }

  .done-banner {
    background: linear-gradient(135deg,#16a34a,#15803d); color: #fff;
    border-radius: var(--radius); padding: 18px; text-align: center; margin-bottom: 12px;
  }
  .done-banner .score { font-size: 34px; font-weight: 800; }
  .done-banner .tip { font-size: 13px; opacity: .9; margin-top: 4px; }
  .done-actions { margin-top: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; border: none; border-radius: 8px; padding: 9px 20px;
    font-size: 14px; cursor: pointer; text-decoration: none; transition: .15s;
  }
  .btn-white { background: rgba(255,255,255,.92); color: #15803d; font-weight: 600; }
  .btn-white:hover { background: #fff; }
  .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text-sub); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; font-weight: 600; }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 13px 4px;
    border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafcff; }
  .row .date-badge {
    flex-shrink: 0; text-align: center; background: var(--primary-light); color: var(--primary);
    border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; line-height: 1.3;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .info .t { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .score-chip { flex-shrink: 0; font-weight: 700; font-size: 14px; }
  .score-chip.good { color: var(--green); }
  .score-chip.mid { color: #d97706; }
  .score-chip.low { color: var(--red); }
  .status-chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .status-chip.done { background: var(--green-bg); color: var(--green); }
  .status-chip.part { background: #fff7e6; color: #d97706; }
  .status-chip.new { background: var(--primary-light); color: var(--primary); }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { text-align: center; padding: 10px 4px; }
  .stat .v { font-size: 20px; font-weight: 800; color: var(--primary); }
  .stat .k { font-size: 11.5px; color: var(--text-sub); }

  .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-bar input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px;
    font-size: 14px; outline: none; background: #fff;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-result { padding: 12px 4px; border-bottom: 1px solid var(--border); }
  .search-result:last-child { border-bottom: none; }
  .search-result .q-line { font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .search-result .q-line:hover { color: var(--primary); }
  .search-result .snippet { font-size: 13px; color: var(--text-sub); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .search-result .meta { font-size: 12px; color: var(--primary); margin-top: 3px; }

  .wrong-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .wrong-item .wq { font-weight: 600; }
  .wrong-item .wmeta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  details summary { cursor: pointer; color: var(--primary); font-size: 13.5px; margin-top: 8px; user-select: none; }
  .wrong-item .ans-line { font-size: 13.5px; margin-top: 8px; }
  .wrong-item .ans-line b.green { color: var(--green); }
  .wrong-item .ans-line b.red { color: var(--red); }
  .link { color: var(--primary); text-decoration: none; cursor: pointer; }
  .wrong-item .w-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .wrong-item .w-redo-area { margin-top: 10px; }
  .wrong-item .redo.ok { border-color: var(--green); color: var(--green); }
  .wrong-item .redo.ok:hover { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .w-removed-bar { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }

  .backup-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(31,45,61,.9); color: #fff; font-size: 13.5px;
    padding: 9px 18px; border-radius: 20px; z-index: 999; animation: fadein .2s;
    max-width: 86vw; text-align: center;
  }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  /* 返回时定位到的题目高亮 */
  .flash { animation: flashHL 2.5s ease; }
  @keyframes flashHL { 0%, 55% { box-shadow: 0 0 0 3px rgba(22,104,220,.5); } 100% { box-shadow: none; } }

  /* 难度分级 */
  .lv-bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .lv-btn { border: 1.5px solid var(--border); background: #fff; color: var(--text-sub); border-radius: 18px; padding: 5px 14px; font-size: 13px; cursor: pointer; transition: .15s; }
  .lv-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .lv-chip { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
  .lv-chip.c1 { background: var(--green-bg); color: var(--green); }
  .lv-chip.c2 { background: #e8f1fd; color: #1668dc; }
  .lv-chip.c3 { background: #fff7e6; color: #d97706; }
  .lv-chip.c4 { background: #ffedd5; color: #ea580c; }
  .lv-chip.c5 { background: var(--red-bg); color: var(--red); }

  /* AI大白话 */
  .plain-block { margin-top: 10px; border-radius: 10px; padding: 10px 12px; background: #f0f7ff; border-left: 3px solid #4d9bf5; font-size: 13.5px; color: #2b3a4e; }
  .plain-block .pt { font-weight: 700; color: #1668dc; font-size: 12.5px; margin-bottom: 3px; }

  /* 语音包 */
  .persona-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .persona-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; background: #fff; cursor: pointer; transition: .15s; position: relative; }
  .persona-card.on { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: #f5faff; }
  .persona-card .pname { font-weight: 700; font-size: 14.5px; padding-right: 40px; }
  .persona-card .pdesc { font-size: 12px; color: var(--text-sub); margin-top: 3px; min-height: 32px; }
  .persona-card .ptag { position: absolute; top: 8px; right: 8px; font-size: 10.5px; background: var(--primary-light); color: var(--primary); border-radius: 8px; padding: 1px 7px; }
  .voice-opts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .voice-opt { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--border); border-radius: 18px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; background: #fff; }
  .voice-opt.on { border-color: var(--primary); color: var(--primary); background: #f5faff; font-weight: 600; }
  @media (max-width: 480px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>

  /* 全局音频互斥：新音频播放前先停掉所有正在播的，杜绝"两个人在说话"叠加 */
  var activeAudios = [];
  function stopAllAudio() {

    save: function () { try { localStorage.setItem('asphaltQuizVoice', JSON.stringify(this.settings)); } catch (e) {} },
    dayIndex: function () { var d = new Date(); var s = new Date(d.getFullYear(), 0, 0); return Math.floor((d - s) / 86400000); },
    currentPersona: function () {
      var key = this.settings.persona;
      if (key && key !== 'auto') {
        for (var i = 0; i < PERSONAS.length; i++) if (PERSONAS[i].key === key) return PERSONAS[i];
      }
      return PERSONAS[this.dayIndex() % PERSONAS.length];
    },
    pickPraise: function (style, tier) {
      var pool = (PRAISE[style] && PRAISE[style][tier]) || PRAISE.cute[tier];
      var rk = style + '-' + tier, rec = this.recent[rk] || [], idx;
      if (pool.length <= 2 || rec.length >= pool.length) {
        idx = Math.floor(Math.random() * pool.length);
      } else {
        do { idx = Math.floor(Math.random() * pool.length); } while (rec.indexOf(idx) >= 0);
      }
      rec.push(idx);
      if (rec.length > Math.max(2, Math.floor(pool.length / 2))) rec = rec.slice(-Math.max(2, Math.floor(pool.length / 2)));
      this.recent[rk] = rec;
      return { text: pool[idx], idx: idx };
    },
    praise: function (level) {
      if (this.settings.enabled === false) return;
      var p = this.currentPersona();
      var tier = level >= 5 ? 2 : (level >= 3 ? 1 : 0);
      /* 震动反馈：即使静音，答对也有"手感" */
      try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}
      /* 连对追踪 */
      var today = new Date().toISOString().slice(0, 10);
      if (this.streakDate !== today) { this.streak = 0; this.streakDate = today; }
      this.streak++;
      /* 连对里程碑欢呼（2/3/5/10） */
      var sm = { 2: 0, 3: 1, 5: 2, 10: 3 };
      if (sm[this.streak] != null) {
        var si = sm[this.streak];
        var stext = (STREAK[p.style] && STREAK[p.style][si]) || STREAK.cute[si];
        this.playAudio(p.style, 'streak' + this.streak, stext, p.pitch, p.rate);

    playSequence: function (style, names, fallbackText, pitch, rate) {
      var idx = 0, anyPlayed = false, moved = false;
      function next() {
        if (moved) return; /* 防 onerror 与 play() 失败回调双重推进 */
        if (idx >= names.length) {
          if (!anyPlayed && fallbackText) toast('🔊 ' + fallbackText);
          return;
        }
        moved = true;
        var name = names[idx++];
        try {
          stopAllAudio();
          var a = new Audio('audio/' + style + '-' + name + '.mp3');

    playAudio: function (style, name, fallbackText, pitch, rate) {
      var failed = false;
      function fallback() {
        if (failed) return;
        failed = true;
        if (fallbackText) toast('🔊 ' + fallbackText); /* 文件缺失时只弹文字，不再启动系统朗读引擎 */
      }
      try {
        stopAllAudio();

      if (!text) return;

  /* ---------- 数据层（题库=静态JSON，记录=localStorage） ---------- */
  var manifest = null;          // { dates: [{date,title,topic,total}] } 按日期倒序

  function loadManifest() {
    if (manifest) return Promise.resolve(manifest);

  function loadQuiz(date) {
    if (quizCache[date]) return Promise.resolve(quizCache[date]);

      quiz.questions = (quiz.questions || []).map(function (q, i) {
        return {
          id: q.id != null ? q.id : i + 1,
          q: String(q.q || ''),
          options: (q.options || []).map(String),
          answer: Number(q.answer) || 0,
          explanation: String(q.explanation || ''),
          plain: String(q.plain || ''),
          level: Math.min(5, Math.max(1, Number(q.level) || 3)),
          references: q.references || []

      quizCache[date] = quiz;

    var correct = Number(selected) === Number(q.answer);
    records[date].answers[String(q.id)] = { selected: Number(selected), correct: correct, level: Number(q.level) || 3, answeredAt: nowISO() };
    records[date].updatedAt = nowISO();
    saveRecords(records);
    return { correct: correct, answer: q.answer, explanation: q.explanation, references: q.references };
  }

    var records = getRecords();

      records[date].updatedAt = nowISO();
      saveRecords(records);

  /* ---------- 汇总计算 ---------- */
  function summarize(entry) {
    var rec = getRec(entry.date);
    var answers = rec.answers || {};
    var answered = Object.keys(answers).length;
    var correct = 0;
    var groups = { 1: { a: 0, c: 0 }, 2: { a: 0, c: 0 }, 3: { a: 0, c: 0 } };
    Object.keys(answers).forEach(function (k) {
      if (answers[k].correct) correct++;
      var g = levelGroup(answers[k].level || 3);
      groups[g].a++;
      if (answers[k].correct) groups[g].c++;
    });
    return {
      date: entry.date, title: entry.title || ('沥青每日答题 ' + entry.date),
      topic: entry.topic || '', total: entry.total || 0, lv: entry.lv || null,
      answered: answered, correct: correct, finished: !!rec.finished, groups: groups
    };

  function groupLine(d) {

    document.querySelectorAll('.opt:not(.locked)').forEach(function (el) {
      el.onclick = function () {
        var qid = el.getAttribute('data-qid'), oi = Number(el.getAttribute('data-oi'));
        var q = quiz.questions.find(function (x) { return String(x.id) === String(qid); });
        if (!q) return;
        document.querySelectorAll('#opts-' + qid + ' .opt').forEach(function (o) { o.classList.add('locked'); });
        var r = submitAnswer(date, q, oi);
        var card = document.getElementById('qc-' + qid);
        var opts = document.getElementById('opts-' + qid);
        opts.querySelectorAll('.opt').forEach(function (o, i) {
          if (i === r.answer) o.classList.add('correct');
          if (i === oi && oi !== r.answer) o.classList.add('wrong');
          if (i === oi) o.classList.add('chosen');
        });
        var div = document.createElement('div');
        div.innerHTML = explainHTML(q, { selected: oi, correct: r.correct }) +
          '<button class="redo" data-redo="' + q.id + '">🔄 重做本题</button>';
        while (div.firstChild) card.appendChild(div.firstChild);
        toast(r.correct ? '✓ 回答正确' : '✗ 回答错误');
        if (r.correct) Voice.praise(q.level);
        else Voice.resetStreak();
        bindRedo(date, quiz, isToday);
        checkFinished(date, quiz, isToday);
      };
    });
    bindRedo(date, quiz, isToday);
  }

  function bindRedo(date, quiz, isToday) {
    document.querySelectorAll('.redo').forEach(function (btn) {
      btn.onclick = function () {
        var qid = btn.getAttribute('data-redo');
        resetQuestion(date, qid);
        renderQuiz(date, isToday);
      };
    });
  }

  function explainHTML(q, a) {
    var html = '<div class="explain">';
    if (a.correct) {
      html += '<div class="verdict ok">✓ 回答正确 · 正确答案 ' + LETTERS[q.answer] + '</div>';
    } else {
      html += '<div class="verdict no">✗ 回答错误 · 你选了 ' + LETTERS[a.selected] + '，正确答案 ' + LETTERS[q.answer] + '</div>';
    }
    html += '<div>' + esc(q.explanation || '（无解析）') + '</div>';
    if (q.plain) {
      html += '<div class="plain-block"><div class="pt">🤖 AI大白话</div>' + esc(q.plain) + '</div>';
    }
    if (q.references && q.references.length) {
      html += '<div class="refs"><div class="ref-title">📚 参考资料（点击学习）</div>';
      q.references.forEach(function (r) {
        html += '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title || r.url) + '</a>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function checkFinished(date, quiz, isToday) {
    var rec = getRec(date);
    var qs = quiz.questions.filter(function (q) { return levelFilter === 0 || levelGroup(q.level) === levelFilter; });
    if (!qs.length) qs = quiz.questions;
    var answeredAll = Object.keys(rec.answers || {}).length;
    var answered = 0, correct = 0;
    qs.forEach(function (q) { var a = rec.answers[String(q.id)]; if (a) { answered++; if (a.correct) correct++; } });
    var bar = document.querySelector('.progress-bar');
    if (bar && qs.length) bar.style.width = (answered / qs.length * 100) + '%';
    var sc = document.querySelector('.score-row');
    if (sc) sc.innerHTML = '<span>' + GROUP_NAMES[levelFilter] + '已答 ' + answered + '/' + qs.length + '</span><span>答对 ' + correct + '</span>';
    if (answeredAll === quiz.questions.length && answeredAll > 0 && !rec.finished) {
      finishDay(date);
      try {
        var p = Voice.currentPersona();
        Voice.playAudio(p.style, 'finish', '哇，今天的题全部答完啦！', p.pitch, p.rate);
      } catch (e) {}
      renderQuiz(date, isToday);
    }
  }

  /* ---------- 历史记录 ---------- */
  function renderHistory() {
    loadManifest().then(function (m) {
      var rows = m.dates.map(summarize);
      var days = rows.length, finishedDays = 0, totalAnswered = 0, totalCorrect = 0;
      rows.forEach(function (d) {
        totalAnswered += d.answered; totalCorrect += d.correct;
        if (d.finished && d.total > 0 && d.answered === d.total) finishedDays++;
      });
      var accuracy = totalAnswered ? Math.round(totalCorrect / totalAnswered * 100) : 0;
      var html = '';
      html += '<div class="card"><div class="stats-grid">' +
        '<div class="stat"><div class="v">' + days + '</div><div class="k">累计天数</div></div>' +
        '<div class="stat"><div class="v">' + finishedDays + '</div><div class="k">完成天数</div></div>' +
        '<div class="stat"><div class="v">' + totalAnswered + '</div><div class="k">累计答题</div></div>' +
        '<div class="stat"><div class="v">' + accuracy + '%</div><div class="k">总正确率</div></div>' +
        '</div></div>';
      if (!rows.length) {
        html += '<div class="card"><div class="empty"><div class="big">📅</div><div>暂无历史记录</div></div></div>';
      } else {
        html += '<div class="card">';
        rows.forEach(function (d) {
          var pct = d.total ? d.correct / d.total : 0;
          var cls = pct >= 0.8 ? 'good' : pct >= 0.5 ? 'mid' : 'low';
          var status = d.answered === 0
            ? '<span class="status-chip new">未作答</span>'
            : (d.answered === d.total ? '<span class="status-chip done">已完成</span>' : '<span class="status-chip part">进行中 ' + d.answered + '/' + d.total + '</span>');
          html += '<div class="row" data-goto="' + d.date + '">' +
            '<div class="date-badge">' + esc(d.date.slice(5).replace('-', '/')) + '<br><span style="font-weight:400;font-size:11px">' + esc(d.date.slice(0, 4)) + '</span></div>' +
            '<div class="info"><div class="t">' + esc(d.topic || d.title) + status + '</div>' +
            '<div class="sub">' + d.answered + '/' + d.total + ' 已答' + groupLine(d) + '</div></div>' +
            '<div class="score-chip ' + cls + '">' + (d.answered ? d.correct + '/' + d.total : '—') + '</div></div>';
        });
        html += '</div>';
      }
      html += '<div class="card"><div class="page-title">💾 记录备份</div>' +
        '<div class="sub">答题记录保存在当前设备浏览器中。换设备前请先导出，再在新设备导入即可延续记录。</div>' +
        '<div class="backup-bar">' +
        '<button class="btn btn-primary" id="btnExport">导出答题记录</button>' +
        '<button class="btn btn-outline" id="btnImport">导入答题记录</button>' +
        '</div></div>';
      app.innerHTML = html;
      document.querySelectorAll('[data-goto]').forEach(function (el) {
        el.onclick = function () { location.hash = '#/quiz/' + el.getAttribute('data-goto'); };
      });
      document.getElementById('btnExport').onclick = exportRecords;
      document.getElementById('btnImport').onclick = function () { document.getElementById('importFile').click(); };
    }).catch(function (e) { app.innerHTML = '<div class="card empty">加载失败：' + esc(e.message) + '</div>'; });
  }

  function exportRecords() {
    var blob = new Blob([JSON.stringify(getRecords(), null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '沥青答题记录_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出答题记录');
  }

  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!incoming || typeof incoming !== 'object') throw new Error('格式不对');
        var records = getRecords();
        Object.keys(incoming).forEach(function (date) {
          var src = incoming[date];
          if (!src || typeof src !== 'object') return;
          var dst = records[date] || { answers: {}, finished: false };
          var srcAnswers = src.answers || {};
          var dstAnswers = dst.answers || {};
          Object.keys(srcAnswers).forEach(function (qid) {
            if (!dstAnswers[qid]) dstAnswers[qid] = srcAnswers[qid];
          });
          dst.answers = dstAnswers;
          if (src.finished) dst.finished = true;
          dst.updatedAt = src.updatedAt || dst.updatedAt;
          records[date] = dst;
        });
        saveRecords(records);
        toast('导入成功，记录已合并');
        renderHistory();
      } catch (err) {
        toast('导入失败：文件不是有效的答题记录');
      }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  /* ---------- 错题本 ---------- */
  function getWrongRemoved() {
    try { return JSON.parse(localStorage.getItem(WRONG_REMOVED_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveWrongRemoved(o) {
    try { localStorage.setItem(WRONG_REMOVED_KEY, JSON.stringify(o)); }
    catch (e) { toast('⚠️ 本地存储写入失败：' + e.message); }
  }
  function removeWrongItem(date, qid) {
    var m = getWrongRemoved();
    if (!m[date]) m[date] = [];
    if (m[date].indexOf(String(qid)) < 0) m[date].push(String(qid));
    saveWrongRemoved(m);
  }
  function restoreWrongAll() { saveWrongRemoved({}); }

  function renderWrong() {
    loadAllQuizzes().then(function (quizzes) {
      var records = getRecords();
      var removed = getWrongRemoved();
      var wrong = [];
      var removedCount = 0;
      quizzes.forEach(function (quiz) {
        var rec = records[quiz.date];
        if (!rec || !rec.answers) return;
        var remList = removed[quiz.date] || [];
        quiz.questions.forEach(function (q) {
          var a = rec.answers[String(q.id)];
          if (a && !a.correct) {
            if (remList.indexOf(String(q.id)) >= 0) { removedCount++; return; }
            wrong.push({ date: quiz.date, topic: quiz.topic || '', question: q, selected: a.selected, answeredAt: a.answeredAt });
          }
        });
      });
      var html = '';
      if (!wrong.length) {
        if (removedCount > 0) {
          html = '<div class="card"><div class="empty"><div class="big">🎉</div><div>错题本已清空！</div>' +
            '<div class="sub" style="margin-top:6px">你已掌握全部错题 · <span class="link" id="restoreWrong">点此恢复已移出的 ' + removedCount + ' 道</span></div></div></div>';
        } else {
          html = '<div class="card"><div class="empty"><div class="big">🎉</div><div>没有错题，继续保持！</div>' +
            '<div class="sub" style="margin-top:6px">做错的题目会自动收录到这里，方便随时复习</div></div></div>';
        }
      } else {
        html += '<div class="card"><div class="page-title">错题本</div><div class="sub">共 ' + wrong.length + ' 道错题 · 可「重做本题」当场再答，或「已掌握」移出</div></div>';
        wrong.forEach(function (w) {
          var q = w.question;
          var lv = q.level || 3;
          html += '<div class="wrong-item" data-date="' + w.date + '" data-qid="' + q.id + '">';
          html += '<div class="wq"><span class="link" data-goto="' + w.date + '">' + w.date + '</span> · ' + esc(q.q) + '<span class="lv-chip c' + lv + '">' + LEVELS[lv] + '</span></div>';
          html += '<div class="wmeta">你选了 ' + LETTERS[w.selected] + '，正确答案 ' + LETTERS[q.answer] + '</div>';
          html += '<div class="w-actions">' +
            '<button class="redo w-redo-btn" data-date="' + w.date + '" data-qid="' + q.id + '">🔄 重做本题</button>' +
            '<button class="redo ok w-remove-btn" data-date="' + w.date + '" data-qid="' + q.id + '">✓ 已掌握，移出</button>' +
            '</div>';
          html += '<div class="w-redo-area" id="wra-' + w.date + '-' + q.id + '"></div>';
          html += '<details><summary>查看解析与参考资料</summary><div class="ans-line">' + esc(q.explanation || '（无解析）') + '</div>' +
            (q.plain ? '<div class="plain-block" style="margin-top:8px"><div class="pt">🤖 AI大白话</div>' + esc(q.plain) + '</div>' : '');
          if (q.references && q.references.length) {
            html += '<div class="refs">';
            q.references.forEach(function (r) { html += '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title || r.url) + '</a>'; });
            html += '</div>';
          }
          html += '</details></div>';
        });
        if (removedCount > 0) {
          html += '<div class="card w-removed-bar">已移出 ' + removedCount + ' 道错题 · <span class="link" id="restoreWrong">点此恢复全部</span></div>';
        }
      }
      app.innerHTML = html;
      document.querySelectorAll('[data-goto]').forEach(function (el) {
        el.onclick = function () { location.hash = '#/quiz/' + el.getAttribute('data-goto'); };
      });
      bindWrongActions();
    }).catch(function (e) { app.innerHTML = '<div class="card empty">加载失败：' + esc(e.message) + '</div>'; });
  }

  function bindWrongActions() {
    // 重做本题（内联作答，答对该题自动移出错题本）
    document.querySelectorAll('.w-redo-btn').forEach(function (btn) {
      btn.onclick = function () {
        var date = btn.getAttribute('data-date');
        var qid = btn.getAttribute('data-qid');
        var area = document.getElementById('wra-' + date + '-' + qid);
        if (!area) return;
        if (area.getAttribute('data-open') === '1') {
          area.innerHTML = ''; area.setAttribute('data-open', '0'); btn.textContent = '🔄 重做本题'; return;
        }
        loadQuiz(date).then(function (quiz) {
          var q = quiz.questions.find(function (x) { return String(x.id) === String(qid); });
          if (!q) return;
          var html = '<div class="opts" id="wropts-' + date + '-' + qid + '">';
          q.options.forEach(function (opt, oi) {
            html += '<div class="opt" data-wrqid="' + qid + '" data-wroi="' + oi + '">' +
              '<span class="letter">' + LETTERS[oi] + '</span><span>' + esc(opt) + '</span></div>';
          });
          html += '</div>';
          area.innerHTML = html;
          area.setAttribute('data-open', '1');
          area.setAttribute('data-answered', '0');
          btn.textContent = '收起重做';
          area.querySelectorAll('.opt').forEach(function (el) {
            el.onclick = function () {
              if (area.getAttribute('data-answered') === '1') return;
              var oi = Number(el.getAttribute('data-wroi'));
              var r = submitAnswer(date, q, oi);
              area.setAttribute('data-answered', '1');
              area.querySelectorAll('.opt').forEach(function (o, i) {
                o.classList.add('locked');
                if (i === r.answer) o.classList.add('correct');
                if (i === oi && oi !== r.answer) o.classList.add('wrong');
                if (i === oi) o.classList.add('chosen');
              });
              var res = document.createElement('div');
              res.innerHTML = explainHTML(q, { selected: oi, correct: r.correct });
              while (res.firstChild) area.appendChild(res.firstChild);
              if (r.correct) {
                toast('✓ 答对了，已从错题本移除');
                setTimeout(function () { renderWrong(); }, 800);
              } else {
                toast('✗ 还是错了，再看看解析');
                var item = el.closest ? el.closest('.wrong-item') : null;
                if (item) {
                  var meta = item.querySelector('.wmeta');
                  if (meta) meta.innerHTML = '你选了 ' + LETTERS[oi] + '，正确答案 ' + LETTERS[q.answer];
                }
              }
            };
          });
        }).catch(function (e) { toast('加载题目失败：' + e.message); });
      };
    });
    // 已掌握，移出错题本（可恢复）
    document.querySelectorAll('.w-remove-btn').forEach(function (btn) {
      btn.onclick = function () {
        if (!confirm('确定将这道错题标记为已掌握并移出错题本？\n移出后仍可在当天答题记录中查看，可随时恢复。')) return;
        removeWrongItem(btn.getAttribute('data-date'), btn.getAttribute('data-qid'));
        renderWrong();
      };
    });
    // 恢复全部已移出
    var rw = document.getElementById('restoreWrong');
    if (rw) rw.onclick = function () { restoreWrongAll(); renderWrong(); };
  }

    PERSONAS.forEach(function (p, i) {
      html += '<div class="persona-card' + (cur.key === p.key ? ' on' : '') + '" data-pk="' + p.key + '">' +
        (i === autoIdx ? '<span class="ptag">今日</span>' : '') +
        '<div class="pname">' + esc(p.name) + '</div><div class="pdesc">' + esc(p.desc) + '</div>' +
        '<button class="btn btn-outline" style="margin-top:8px;padding:5px 12px;font-size:12.5px" data-try="' + p.key + '">▶ 试听</button></div>';
    });
    html += '</div></div>';
    html += '<div class="card"><div class="page-title">同一音色，难度越高越崇拜</div>' +
      '<div class="backup-bar">' +
      '<button class="btn btn-outline" data-demo="1">入门题夸奖</button>' +
      '<button class="btn btn-outline" data-demo="3">进阶题夸奖</button>' +
      '<button class="btn btn-outline" data-demo="5">挑战题夸奖</button>' +
      '</div></div>';
    html += '<div class="card"><div class="page-title">🔥 连对欢呼试听</div>' +
      '<div class="sub" style="margin-bottom:8px">连续答对触发升级欢呼，越连越燃</div>' +
      '<div class="backup-bar">' +
      '<button class="btn btn-outline" data-streak="2">2连对</button>' +
      '<button class="btn btn-outline" data-streak="3">3连对</button>' +
      '<button class="btn btn-outline" data-streak="5">5连对</button>' +
      '<button class="btn btn-outline" data-streak="10">10连对</button>' +
      '</div></div>';
    /* 语音自检：内置真人语音包为主，系统朗读引擎仅作备用 */
    var diag = '✅ 平台已内置真人神经网络语音包（Fish Audio 神经网络语音合成，共约200条），播放方式和看视频一样，<b>不依赖手机朗读引擎</b>，任何浏览器都能响。';
    diag += '<br>如果还是没声音，只需检查两点：① 手机<b>媒体音量</b>（看视频的音量）是否打开；② 尽量用系统浏览器（Safari/Chrome/Edge）打开或加到桌面，个别 App 内置浏览器会拦截音频。';
    html += '<div class="card"><div class="page-title" style="font-size:16px">🔍 语音自检</div>' +
      '<div class="sub" style="line-height:1.75">' + diag + '</div>' +
      '<div class="backup-bar">' +
      '<button class="btn btn-outline" id="testSound">🔊 点我出声测试</button>' +
      '</div></div>';
    html += '<div class="card"><div class="sub" style="line-height:1.75">语音由 Fish Audio 神经网络引擎预合成：小萝莉、甜妹、御姐、温柔姐姐、川妹子（四川话文案）、鲁妹子（山东话文案），每答对一题随机播放不重复；难度越高夸得越热烈。<br>已全程使用平台内置语音包，不会混入手机系统朗读声；万一某个音频加载失败，只会弹出文字提示，不影响答题。</div></div>';
    app.innerHTML = html;

    document.querySelectorAll('[data-vp]').forEach(function (el) {
      el.onclick = function () { Voice.settings.persona = 'auto'; Voice.save(); renderVoice(); };
    });
    document.querySelector('[data-vmute]').onclick = function () {
      Voice.settings.enabled = (Voice.settings.enabled === false);
      Voice.save(); renderVoice();
      if (Voice.settings.enabled) Voice.praise(1);
    };
    document.querySelectorAll('.persona-card').forEach(function (card) {
      card.onclick = function (e) {
        if (e.target && e.target.getAttribute && e.target.getAttribute('data-try')) return;
        Voice.settings.persona = card.getAttribute('data-pk');
        Voice.settings.enabled = true;
        Voice.save(); renderVoice();
        Voice.praise(3);
      };
    });
    document.querySelectorAll('[data-try]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var key = btn.getAttribute('data-try'), p = null;
        PERSONAS.forEach(function (x) { if (x.key === key) p = x; });
        if (p) Voice.playAudio(p.style, 'hello', null, p.pitch, p.rate);
      };
    });
    document.querySelectorAll('[data-demo]').forEach(function (btn) {
      btn.onclick = function () {
        var lv = Number(btn.getAttribute('data-demo'));
        var p = Voice.currentPersona();
        var tier = lv >= 5 ? 2 : (lv >= 3 ? 1 : 0);
        var pk = Voice.pickPraise(p.style, tier);
        var exArr = EXCL[p.style] || EXCL.cute;
        var ei = Math.floor(Math.random() * exArr.length);
        Voice.playSequence(p.style, ['excl-' + ei, tier + '-' + pk.idx], pk.text, p.pitch, p.rate);
      };
    });
    document.querySelectorAll('[data-streak]').forEach(function (btn) {
      btn.onclick = function () {
        var n = Number(btn.getAttribute('data-streak'));
        var p = Voice.currentPersona();
        var si = { 2: 0, 3: 1, 5: 2, 10: 3 }[n];
        var stext = (STREAK[p.style] && STREAK[p.style][si]) || STREAK.cute[si];
        Voice.playAudio(p.style, 'streak' + n, stext, p.pitch, p.rate);
      };
    });
    document.getElementById('testSound').onclick = function () {
      var p = Voice.currentPersona();
      Voice.playAudio(p.style, 'hello', '出声测试，今天由' + p.name + '陪你刷题', p.pitch, p.rate);
    };
  }

  /* ---------- 路由 ---------- */
  function route() {
    var h = location.hash || '#/today';
    var m;
    document.querySelectorAll('nav a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === h || (h === '#/today' && a.getAttribute('href') === '#/today'));
    });
    // 切换 tab 后把当前标签横向居中滚入视野，避免横滑条卡住后回不到第一个
    try {
      var act = document.querySelector('nav a.active');
      if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
    } catch (e) {}
    if ((m = h.match(/^#\/quiz\/(\d{4}-\d{2}-\d{2})$/))) {
      renderQuiz(m[1], false);
    } else if (h === '#/history') {
      renderHistory();
    } else if (h === '#/wrong') {
      renderWrong();
    } else if (h === '#/search') {
      renderSearch();
    } else if (h === '#/ai') {
      renderAI();
    } else if (h === '#/voice') {
      renderVoice();
    } else {
      renderToday();
    }
  }
  /* ---------- 返回键体验 ---------- */
  // 1) 点参考资料链接前记录当前题目，返回时回到该题并高亮
  // 2) 手机返回键：先在应用内逐级返回，回到首页后再按一次才退出
  var SS_KEY = 'asphaltQuizView';
  var RESTORE_WINDOW = 3 * 3600 * 1000; // 3小时内视为同一会话，可恢复浏览位置

  function saveViewState(extra) {
    try {
      var s = { hash: location.hash || '#/today', scroll: window.scrollY || 0, t: Date.now() };
      if (extra) for (var k in extra) s[k] = extra[k];
      sessionStorage.setItem(SS_KEY, JSON.stringify(s));
    } catch (e) {}
  }
  function getViewState() {
    try { return JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'); } catch (e) { return null; }
  }

  // 点击参考资料（外部链接）时，记下当时所在题目卡片
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[target="_blank"]') : null;
    if (!a) return;
    var card = a.closest ? a.closest('[id^="qc-"], .wrong-item, .card') : null;
    saveViewState({ qid: card && card.id ? card.id : '' });
  }, true);

  // 离开页面 / 切后台 / 滚动时保存浏览位置
  window.addEventListener('pagehide', function () { saveViewState(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveViewState();
  });
  var scrollSaveTimer = null;
  window.addEventListener('scroll', function () {
    if (scrollSaveTimer) return;
    scrollSaveTimer = setTimeout(function () { scrollSaveTimer = null; saveViewState(); }, 500);
  }, { passive: true });

  // 启动恢复：从外部链接返回（页面被重新加载）时，回到之前的视图
  (function bootRestore() {
    var s = getViewState();
    if (s && s.hash && s.hash !== '#/today' && !location.hash && Date.now() - (s.t || 0) < RESTORE_WINDOW) {
      try { history.replaceState(null, '', s.hash); } catch (e) { location.hash = s.hash; }
    }
  })();

  function restoreView() {
    var s = getViewState();
    if (!s || Date.now() - (s.t || 0) >= RESTORE_WINDOW) return;
    var el = s.qid ? document.getElementById(s.qid) : null;
    if (el) {
      var y = el.getBoundingClientRect().top + window.scrollY - 84; // 顶部留出导航高度
      window.scrollTo(0, Math.max(0, y));
      el.classList.add('flash');
      setTimeout(function () { el.classList.remove('flash'); }, 2500);
    } else if (s.scroll > 0) {
      window.scrollTo(0, s.scroll);
    }
  }
  function waitForRestore(tries) {
    if (tries <= 0) { restoreView(); return; }
    if (app.innerHTML.indexOf('加载中') >= 0) { setTimeout(function () { waitForRestore(tries - 1); }, 150); }
    else { setTimeout(restoreView, 60); }
  }

  // 首页哨兵：让返回键先在应用内逐级返回，首页时再按一次才退出
  var lastBackTry = 0;
  try {
    history.replaceState({ d: 0 }, '', location.href);
    history.pushState({ d: 1 }, '', location.href);
  } catch (e) {}
  window.addEventListener('popstate', function () {
    var st = history.state;
    if (st && st.d === 0) {
      var h = location.hash || '#/today';
      if (h !== '#/today') return; // 直接打开的子页面，返回键正常退回上一页
      var now = Date.now();
      if (now - lastBackTry < 2200) {
        lastBackTry = 0;
        history.back(); // 2.2秒内再按一次 → 真正退出
      } else {
        lastBackTry = now;
        try { history.pushState({ d: 1 }, '', location.href); } catch (e) {}
        toast('再按一次返回键退出');
      }
    }
  });

  window.addEventListener('hashchange', route);
  route();
  waitForRestore(40);
})();
</script>
</body>
</html>
